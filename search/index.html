    <script type="application/json" id="search-index">[{"t":"Броненакладки и пластины","d":"Броненакладки и бронепластины для цилиндровых и сувальдных замков. Подбор по типу замка и толщине двери, установка.","u":"/armor-key-preview/catalog/bronenakladki-i-komplektuyushchie/bronenakladki-i-plastiny/"},{"t":"Броненакладки и комплектующие","d":"Броненакладки и пластины, магнитные броненакладки, перекодировочные комплекты для замков. Подбор под цилиндр, установка мастером.","u":"/armor-key-preview/catalog/bronenakladki-i-komplektuyushchie/"},{"t":"Магнитные броненакладки","d":"Магнитные броненакладки с закрывающейся шторкой для цилиндровых замков. Защита от вандализма и манипуляций. Установка.","u":"/armor-key-preview/catalog/bronenakladki-i-komplektuyushchie/magnitnye-bronenakladki/"},{"t":"Перекодировочные комплекты для замков","d":"Перекодировочные комплекты для сувальдных замков: новые ключи без замены замка. Подбор по модели, установка мастером.","u":"/armor-key-preview/catalog/bronenakladki-i-komplektuyushchie/perekodirovochnye-kompekty-dlya-zamkov/"},{"t":"Дополнительные опции EVVA","d":"Дополнительные опции и комплектующие для цилиндров EVVA. Заказ у официального дилера в Санкт-Петербурге.","u":"/armor-key-preview/catalog/dopolnitelnye-optsii/evva/"},{"t":"Дополнительные опции к цилиндрам","d":"Дополнительные опции и комплектующие для цилиндров EVVA и Mul-T-Lock: удлинители, вертушки, защитные функции. Официальный дилер.","u":"/armor-key-preview/catalog/dopolnitelnye-optsii/"},{"t":"Дополнительные опции Mul-T-Lock","d":"Дополнительные опции и комплектующие для цилиндров Mul-T-Lock. Заказ у официального дилера в Санкт-Петербурге.","u":"/armor-key-preview/catalog/dopolnitelnye-optsii/mul-t-lock/"},{"t":"Каталог замков и комплектующих","d":"Замки, цилиндровые механизмы, броненакладки и мастер-системы Cisa, Mottura, Securemme, Mul-T-Lock. Прямые поставки, цены ниже маркетплейсов, доставка по СПб и России.","u":"/armor-key-preview/catalog/"},{"t":"Мастер-система под один ключ","d":"Цилиндры под один ключ и иерархические мастер-системы Mul-T-Lock, EVVA, Mottura для дома, офиса и ЖК. Сборка за 1 день, при покупке цилиндров — бесплатно.","u":"/armor-key-preview/catalog/master-sistema-pod-odin-klyuch/"},{"t":"Цилиндровые механизмы Апекс","d":"Цилиндровые механизмы Апекс (Apecs) для входных и межкомнатных дверей. Недорогие цилиндры с перекодировкой и мастер-системами.","u":"/armor-key-preview/catalog/tsilindrovye-mekhanizmy/apeks/"},{"t":"Цилиндровые механизмы (личинки)","d":"Цилиндры Cisa, Mottura, Securemme, Mul-T-Lock, EVVA с картой владельца. Подбор размера, замена личинки мастером, прямые поставки.","u":"/armor-key-preview/catalog/tsilindrovye-mekhanizmy/"},{"t":"Цилиндровые механизмы Securemme","d":"Цилиндры Securemme для входных дверей. Подбор размера, замена личинки и замков Securemme, изготовление ключей.","u":"/armor-key-preview/catalog/tsilindrovye-mekhanizmy/securemme/"},{"t":"Цилиндровые механизмы Mul-T-Lock","d":"Цилиндровые механизмы Mul-T-Lock: Interactive+, Classic, MT5 и другие серии. Официальный дилер, карта владельца, перекодировка.","u":"/armor-key-preview/catalog/tsilindrovye-mekhanizmy/tsilindrovye-mekhanizmy-mul-t-lock/"},{"t":"Цилиндровые механизмы Rav-Bariach","d":"Цилиндровые механизмы Rav-Bariach (Израиль) для стальных дверей. Подбор размера и замена личинки в Санкт-Петербурге.","u":"/armor-key-preview/catalog/tsilindrovye-mekhanizmy/tsilindrovye-mekhanizmy-rav-bariach1/"},{"t":"Цилиндровые механизмы Cisa","d":"Цилиндровые механизмы Cisa Asix, Astral, AP3 и другие. Подбор размера, замена личинки, изготовление ключей Cisa в мастерской.","u":"/armor-key-preview/catalog/tsilindrovye-mekhanizmy/tsilindrovyy-mekhanizm-cisa-italiya/"},{"t":"Цилиндровые механизмы EVVA","d":"Цилиндры EVVA ICS, 3KS, 4KS, EPS, MCS с картой владельца. Официальный дилер в Санкт-Петербурге, изготовление ключей, мастер-системы.","u":"/armor-key-preview/catalog/tsilindrovye-mekhanizmy/tsilindrovyy-mekhanizm-evva-avstriya/"},{"t":"Цилиндровые механизмы Kale Kilit","d":"Цилиндровые механизмы Kale Kilit для входных дверей. Подбор размера по фото, замена личинки мастером в Санкт-Петербурге.","u":"/armor-key-preview/catalog/tsilindrovye-mekhanizmy/tsilindrovyy-mekhanizm-kale-kilit-turtsiya/"},{"t":"Цилиндровые механизмы Mottura","d":"Цилиндры Mottura Champion, Champion Pro, C39 и другие серии. Официальный дилер, изготовление ключей, перекодировка серии J.","u":"/armor-key-preview/catalog/tsilindrovye-mekhanizmy/tsilindrovyy-mekhanizm-mottura-italiya/"},{"t":"Замки для входных дверей","d":"Врезные, накладные и навесные замки для металлических и деревянных дверей. Cisa, Mottura, Securemme, Mul-T-Lock. Подбор по фото, установка от 6 000 ₽.","u":"/armor-key-preview/catalog/zamki/"},{"t":"Накладные замки","d":"Накладные замки для металлических и деревянных дверей, с вертушкой и защёлкой. Подбор и установка мастером в Санкт-Петербурге.","u":"/armor-key-preview/catalog/zamki/nakladnye-zamki/"},{"t":"Навесные замки","d":"Навесные замки для гаражей, складов, ворот и калиток. Замки с защищённой дужкой и высокой секретностью. Доставка по СПб.","u":"/armor-key-preview/catalog/zamki/navesnye-zamki/"},{"t":"Врезные замки","d":"Врезные сувальдные, цилиндровые и двухсистемные замки для металлических и деревянных дверей. Подбор по габаритам, установка мастером.","u":"/armor-key-preview/catalog/zamki/vreznye-zamki/"},{"t":"Замок врезной Apecs 1423-G","d":"Замок врезной Apecs 1423-G для входных и межкомнатных дверей. Официальная гарантия 2 года, установка за 1 день.","u":"/armor-key-preview/catalog/zamki/vreznye-zamki/zamok-vreznoy-apecs-1423-g/"},{"t":"Мастерская, которой доверяют ключи","d":"Armor Key — мастерская и магазин замков в Санкт-Петербурге. Изготовление ключей, установка и ремонт замков, официальный дилер EVVA, Mul-T-Lock, Mottura.","u":"/armor-key-preview/company/"},{"t":"Контакты","d":"Адрес мастерской Armor Key: Санкт-Петербург, пр. Юрия Гагарина, 34 к2. Телефон 8 (812) 926-40-48, ежедневно 10:00–20:00.","u":"/armor-key-preview/contacts/"},{"t":"Доставка и оплата","d":"Самовывоз бесплатно, доставка по Санкт-Петербургу в день заказа, СДЭК по России. Бесплатная доставка от 10 000 ₽. Оплата наличными, картой, по счёту.","u":"/armor-key-preview/help/delivery/"},{"t":"Гарантия и возврат","d":"Официальная гарантия на замки до 2 лет. Возврат товара в течение 14 дней, для заказов с доставкой — 7 дней с момента получения.","u":"/armor-key-preview/help/warranty/"},{"t":"Надёжные замки и&nbsp;ключи за 10 минут","d":"Взломостойкие замки, цилиндры и броненакладки EVVA, Mul-T-Lock, Mottura. Изготовление ключей, вскрытие, замена и установка замков в СПб. Официальный дилер, гарантия 2 года.","u":"/"},{"t":"EVVA в Санкт-Петербурге","d":"Официальный дилер EVVA в СПб: цилиндры EPS, ICS, 3KS, 4KS, MCS с картой владельца, изготовление ключей, мастер-системы.","u":"/armor-key-preview/info/brands/evva/"},{"t":"Бренды","d":"EVVA, Mul-T-Lock, Mottura, Cisa, Securemme, Kale и другие бренды замков в Санкт-Петербурге. Официальная гарантия, цены производителя.","u":"/armor-key-preview/info/brands/"},{"t":"Mottura в Санкт-Петербурге","d":"Официальный дилер Mottura в СПб: цилиндры Champion и Champion Pro, ключи MY-KEY, C39, C30, перекодировка замков серии J.","u":"/armor-key-preview/info/brands/mottura/"},{"t":"Mul-T-Lock в Санкт-Петербурге","d":"Официальный дилер Mul-T-Lock в СПб: цилиндры Interactive+, Classic, MT5, ключи по карте, перекодировка цилиндров на новые ключи.","u":"/armor-key-preview/info/brands/mul_t_lock/"},{"t":"Политика обработки персональных данных","d":"Политика в отношении обработки персональных данных пользователей сайта armor-key.ru.","u":"/armor-key-preview/privacy/"},{"t":"Акции","d":"Скидки на мастер-системы, изготовление ключей, установку и замену замков, броненакладки в Санкт-Петербурге.","u":"/armor-key-preview/sale/"},{"t":"Услуги и цены","d":"Изготовление ключей, вскрытие, замена, установка и перекодировка замков, автоключи и мастер-системы в Санкт-Петербурге. Актуальные цены.","u":"/armor-key-preview/services/"},{"t":"Изготовление автоключей","d":"Дубликаты автоключей, ключи с чипом и пультом, копия чипа для автозапуска. Изготовление по замку зажигания или двери. Цены от 1 500 ₽.","u":"/armor-key-preview/services/izgotovlenie-avtoklyuchey/"},{"t":"Изготовление дубликатов ключей EVVA","d":"Дубликаты ключей EVVA EPS, 3KS, ICS, 4KS, MCS по карте владельца. Официальный дилер EVVA в Санкт-Петербурге. EPS — за 5 минут, 3KS — за 10 минут.","u":"/armor-key-preview/services/izgotovlenie-dublikatov-klyuchey-evva/"},{"t":"Изготовление ключей","d":"Изготовление дубликатов ключей EVVA, Mul-T-Lock, Mottura, Cisa, Securemme, Gerda, Disec. Большинство ключей — за 5–15 минут при вас. Официальный дилер.","u":"/armor-key-preview/services/izgotovlenie-klyuchey/"},{"t":"Изготовление ключей Cisa","d":"Дубликаты ключей Cisa Asix, Astral, AP3, RS3 и сувальдных «бабочек». От 5 минут, гарантия на все копии. Мастерская на пр. Юрия Гагарина.","u":"/armor-key-preview/services/izgotovlenie-klyuchey-cisa/"},{"t":"Изготовление мастер-систем","d":"Цилиндры под один ключ и иерархические мастер-системы Mul-T-Lock, EVVA, Mottura, Апекс. Сборка за 1 день, при покупке цилиндров — бесплатно.","u":"/armor-key-preview/services/izgotovlenie-master-sistem/"},{"t":"Перекодировка замков","d":"Перекодировка замков Mul-T-Lock, Cisa, Mottura, Гардиан на новые ключи без замены замка. Официальный партнёр Mul-T-Lock, выезд мастера.","u":"/armor-key-preview/services/perekodirovka-zamkov/"},{"t":"Установка замков","d":"Установка врезных и накладных замков в металлические и деревянные двери, калитки. Установка ручек и задвижек. Цены от 6 000 ₽, гарантия.","u":"/armor-key-preview/services/ustanovka-zamkov/"},{"t":"Вскрытие замков","d":"Аккуратное вскрытие дверных замков, сейфов и автомобилей в Санкт-Петербурге. Цены от 3 500 ₽, выезд мастера, восстановление или замена замка.","u":"/armor-key-preview/services/vskrytie-zamkov/"},{"t":"Замена замков и личинок","d":"Замена замков, личинок и дверных ручек на металлических и деревянных дверях. Цены от 4 500 ₽, выезд мастера по СПб, гарантия на работы.","u":"/armor-key-preview/services/zamena-zamkov/"},{"t":"Замена замков Securemme","d":"Замена замков и цилиндров Securemme на входных дверях. Подбор оригинальных комплектующих, выезд мастера по СПб, гарантия на работы.","u":"/armor-key-preview/services/zamena-zamkov-securemme/"}]</script>
